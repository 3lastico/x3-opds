name: Build Daily News Brief

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"
      timezone: "Europe/Berlin"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Daily Brief
        run: python generate_daily_news.py

      - name: Keep only last 7 Daily Briefs
        run: |
          python - <<'PY'
          from pathlib import Path

          folder = Path("books/daily")

          if folder.exists():
              files = sorted(
                  folder.glob("daily-brief-*.epub"),
                  reverse=True
              )

              for old_file in files[7:]:
                  print(f"Deleting {old_file}")
                  old_file.unlink()
          PY

      - name: Commit Daily Brief
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add books/daily

          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Add daily news brief"
            git push
          fi
